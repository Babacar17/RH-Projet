<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{juryBean.offreId}"/>
        <f:viewAction action="#{juryBean.charger}"/>
    </f:metadata>

<h:head>
    <title>Notation jury — Chef de Structure</title>
        <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f8fafc; color: #0f172a; font-family: 'Segoe UI', sans-serif; font-size: 14px; }
        a { text-decoration: none; color: inherit; }

        /* Layout */
        .mg-sidebar { width: 220px; height: 100vh; background: #0f172a; display: flex; flex-direction: column;
                      border-right: 1px solid #1e293b; flex-shrink: 0; position: sticky; top: 0; overflow-y: auto; }
        .mg-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .mg-sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 16px;
                           border-bottom: 1px solid #1e293b; }
        .logo-icon { width: 36px; height: 36px; border-radius: 8px; background: #16a34a;
                     display: flex; align-items: center; justify-content: center;
                     font-weight: 800; font-size: 13px; color: #fff; }
        .logo-title { font-size: 13px; font-weight: 700; color: #f1f5f9; }
        .logo-sub { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
        .mg-nav { flex: 1; padding: 12px 0; }
        .nav-section { padding: 8px 16px 4px; font-size: 10px; color: #475569;
                       text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px;
                    color: #94a3b8; font-size: 13px; cursor: pointer; transition: all .15s; }
        .nav-item:hover { background: rgba(255,255,255,.05); color: #f1f5f9; }
        .nav-item.active { background: rgba(22,163,74,.12); color: #4ade80;
                           border-left: 3px solid #16a34a; }
        .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
        .mg-sidebar-footer { padding: 16px; border-top: 1px solid #1e293b; }
        .sidebar-user { display: flex; align-items: center; gap: 10px; }
        .sidebar-user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #16a34a;
                               display: flex; align-items: center; justify-content: center;
                               font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0; }
        .sidebar-user-name { font-size: 12px; font-weight: 600; color: #f1f5f9; }
        .sidebar-user-role { font-size: 10px; color: #64748b; }

        /* Topbar */
        .mg-topbar { display: flex; align-items: center; justify-content: space-between;
                     padding: 16px 28px; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .mg-topbar h1 { font-size: 20px; font-weight: 700; }
        .breadcrumb { font-size: 12px; color: #64748b; margin-top: 2px; }
        .mg-topbar-right { display: flex; align-items: center; gap: 12px; }
        .topbar-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
        .role-pill { background: #dcfce7; color: #15803d; padding: 2px 8px;
                     border-radius: 999px; font-size: 10px; font-weight: 700; }
        .btn-logout { background: #ef4444 !important; color: #fff !important; border: none !important;
                      padding: 7px 14px !important; border-radius: 7px !important; font-size: 12px !important;
                      cursor: pointer !important; }

        /* Content */
        .mg-content { padding: 24px 28px; overflow-y: auto; flex: 1; }

        /* Buttons (reutilise par le fragment de notation) */
        .btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px;
               border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer;
               border: none; transition: all .15s; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        </style>
</h:head>
<h:body>
<div style="display:flex;">
    <ui:include src="sidebar-manager.xhtml"><ui:param name="page" value="notation-jury"/></ui:include>

    <div class="mg-main">
        <div class="mg-topbar">
            <div class="mg-topbar-left">
                <h1>Notation — Concours &amp; Jury</h1>
                <div class="breadcrumb">Saisissez vos notes pour les candidats de cette offre</div>
            </div>
            <div class="mg-topbar-right">
                <div class="topbar-badge">
                    <span>#{sessionBean.nomComplet}</span>
                    <span class="role-pill">MANAGER</span>
                </div>
                <h:form>
                    <p:commandButton value="Deconnexion" action="#{loginBean.logout}"
                        styleClass="btn-logout" ajax="false"/>
                </h:form>
            </div>
        </div>

        <div class="mg-content">
            <p:growl id="growl" showDetail="true" life="4000"/>

            <ui:include src="/WEB-INF/includes/jury-notation-body.xhtml"/>
        </div>
    </div>
</div>
</h:body>
</html>
