<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Reporting &amp; Tableaux de bord &#8212; Administration SIRH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="admin-style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            background: #f1f5f9; color: #0f172a;
            display: flex; min-height: 100vh; font-size: 14px;
        }
        a { text-decoration: none; color: inherit; }
        :root {
            --sidebar-w: 256px;
            --navy: #0f172a; --navy2: #1e293b;
            --gold: #b58a3a; --gold-l: #f0c97a;
            --purple: #7c3aed; --purple-l: #a78bfa;
            --green: #10b981; --red: #ef4444;
            --yellow: #f59e0b; --blue: #3b82f6;
            --border: #e2e8f0; --card: #ffffff;
            --bg: #f1f5f9; --text2: #64748b; --text3: #94a3b8;
            --radius: 12px;
        }

        .main-content { flex: 1; padding: 28px; min-height: 100vh; }
        .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .page-title { font-size: 22px; font-weight: 800; color: var(--navy); }
        .page-subtitle { font-size: 12px; color: var(--text3); margin-top: 3px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* ── KPI ── */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
        .kpi-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .kpi-icon.purple { background: #ede9fe; color: var(--purple); }
        .kpi-icon.green  { background: #dcfce7; color: var(--green); }
        .kpi-icon.blue   { background: #dbeafe; color: var(--blue); }
        .kpi-icon.gold   { background: #fef3c7; color: var(--gold); }
        .kpi-icon.red    { background: #fee2e2; color: var(--red); }
        .kpi-val { font-size: 24px; font-weight: 800; color: var(--navy); line-height: 1; }
        .kpi-label { font-size: 11px; color: var(--text2); margin-top: 3px; font-weight: 600; }
        .kpi-delta { font-size: 10px; font-weight: 700; margin-top: 4px; }
        .kpi-delta.up { color: var(--green); }
        .kpi-delta.down { color: var(--red); }

        /* ── Tabs ── */
        .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 22px; overflow-x: auto; }
        .tab { padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: color .18s, border-color .18s; }
        .tab:hover { color: var(--purple); }
        .tab.active { color: var(--purple); border-bottom-color: var(--purple); }

        /* ── Cards ── */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card-title i { color: var(--purple); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        @media (max-width: 1100px) { .three-col { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 900px)  { .two-col, .three-col { grid-template-columns: 1fr; } }

        /* ── Tab content ── */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Rapports cards ── */
        .rapport-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .rapport-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .18s, transform .18s; cursor: pointer; }
        .rapport-card:hover { box-shadow: 0 4px 20px rgba(124,58,237,.1); transform: translateY(-2px); }
        .rapport-card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
        .rapport-card-title { font-size: 13px; font-weight: 700; color: var(--navy); }
        .rapport-card-desc { font-size: 11px; color: var(--text2); line-height: 1.5; }
        .rapport-card-actions { display: flex; gap: 8px; margin-top: 4px; }
        .btn-xs { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: all .16s; }
        .btn-xs-purple { background: #ede9fe; color: var(--purple); }
        .btn-xs-purple:hover { background: var(--purple); color: #fff; }
        .btn-xs-green { background: #dcfce7; color: #15803d; }
        .btn-xs-green:hover { background: var(--green); color: #fff; }
        .btn-xs-blue { background: #dbeafe; color: #1e40af; }
        .btn-xs-blue:hover { background: var(--blue); color: #fff; }

        /* ── Tableau comparatif ── */
        .comp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .comp-table th { text-align: left; padding: 8px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); background: #f8fafc; border-bottom: 2px solid var(--border); }
        .comp-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .comp-table tr:last-child td { border-bottom: none; }
        .comp-table tr:hover td { background: #f8fafc; }
        .bar-wrap { height: 8px; background: #e2e8f0; border-radius: 4px; min-width: 80px; }
        .bar-fill { height: 100%; border-radius: 4px; }
        .bar-purple { background: var(--purple); }
        .bar-green  { background: var(--green); }
        .bar-blue   { background: var(--blue); }

        /* ── KPI badge ── */
        .kpi-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
        .kpi-badge.up   { background: #dcfce7; color: #15803d; }
        .kpi-badge.down { background: #fee2e2; color: #991b1b; }

        /* ── Toolbar ── */
        .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filter-select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; background: var(--card); color: var(--navy); }

        /* ── Buttons ── */
        .btn { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all .18s; font-family: inherit; }
        .btn-purple { background: var(--purple); color: #fff; }
        .btn-purple:hover { background: #6d28d9; }
        .btn-outline { background: transparent; color: var(--text2); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--bg); }
        .btn-gold { background: var(--gold); color: #fff; }
        .btn-gold:hover { background: #a07832; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-green:hover { background: #059669; }

        /* ── Chart container ── */
        .chart-wrap { position: relative; height: 260px; }

        @media (max-width: 768px) {
            .main-content { margin-left: 0; padding: 16px; padding-top: 60px; }
            .kpi-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</h:head>

<h:body>
<ui:include src="sidebar-admin.xhtml"/>

<div class="main-content">

    <!-- En-tête -->
    <div class="page-header">
        <div>
            <h1 class="page-title"><i class="fas fa-chart-bar" style="color:#7c3aed;margin-right:8px;"></i>Reporting &amp; Tableaux de bord</h1>
            <p class="page-subtitle">Administration &#8250; Analytique &amp; Rapports</p>
        </div>
        <div class="header-actions">
            <h:form id="fBtnReporting">
                <p:selectOneMenu value="#{adminBean.institutionFiltreId}"
                                 style="min-width:220px;font-size:12px;">
                    <f:selectItem itemLabel="Toutes les institutions" itemValue="#{null}"/>
                    <f:selectItems value="#{adminBean.toutesInstitutions}"
                                   var="inst" itemLabel="#{inst.nom}" itemValue="#{inst.id}"/>
                </p:selectOneMenu>
                <p:selectOneMenu value="#{adminReportingBean.rapportAnnee}"
                                 style="width:90px;font-size:12px;margin-left:6px;">
                    <f:selectItem itemLabel="2026" itemValue="2026"/>
                    <f:selectItem itemLabel="2025" itemValue="2025"/>
                    <f:selectItem itemLabel="2024" itemValue="2024"/>
                    <f:selectItem itemLabel="2023" itemValue="2023"/>
                </p:selectOneMenu>
                <p:commandButton value="Actualiser" icon="fas fa-sync-alt"
                                 styleClass="btn btn-purple" style="margin-left:6px;"
                                 action="#{adminReportingBean.rafraichirKPIs}" ajax="true"
                                 update="reportingContent"/>
            </h:form>
        </div>
    </div>

    <!-- KPI globaux -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-icon purple"><i class="fas fa-users"></i></div>
            <div>
                <div class="kpi-val">#{adminReportingBean.effectifTotal}</div>
                <div class="kpi-label">Effectif total</div>
                <div class="kpi-delta up">&#9650; +0 ce mois</div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon green"><i class="fas fa-money-bill-wave"></i></div>
            <div>
                <div class="kpi-val">#{adminReportingBean.masseSalariale}</div>
                <div class="kpi-label">Masse salariale</div>
                <div class="kpi-delta up">&#9650; +2.3%</div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon red"><i class="fas fa-door-open"></i></div>
            <div>
                <div class="kpi-val">#{adminReportingBean.tauxTurnover}%</div>
                <div class="kpi-label">Taux de turnover</div>
                <div class="kpi-delta down">&#9660; -0.4% vs an pass&#233;</div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon gold"><i class="fas fa-user-times"></i></div>
            <div>
                <div class="kpi-val">#{adminReportingBean.tauxAbsenteisme}%</div>
                <div class="kpi-label">Absent&#233;isme moyen</div>
                <div class="kpi-delta up">&#9650; Stable</div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon blue"><i class="fas fa-university"></i></div>
            <div>
                <div class="kpi-val">#{adminReportingBean.totalInstitutions}</div>
                <div class="kpi-label">Institutions actives</div>
                <div class="kpi-delta">Consolidé</div>
            </div>
        </div>
    </div>

    <!-- Onglets -->
    <div class="tabs">
        <div class="tab active" onclick="switchTabR('vue-globale', this)">&#127758; Vue globale</div>
        <div class="tab" onclick="switchTabR('effectifs', this)">&#128101; Effectifs</div>
        <div class="tab" onclick="switchTabR('masse-salariale', this)">&#128184; Masse salariale</div>
        <div class="tab" onclick="switchTabR('absenteisme', this)">&#128197; Absent&#233;isme</div>
        <div class="tab" onclick="switchTabR('comparatif', this)">&#128202; Comparatif institutions</div>
        <div class="tab" onclick="switchTabR('rapports', this)">&#128196; Rapports &amp; Exports</div>
    </div>

    <p:outputPanel id="reportingContent" layout="block">

    <!-- ══════ TAB : Vue globale ══════ -->
    <div id="tab-vue-globale" class="tab-content active">
        <div class="two-col">
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-line"></i> &#201;volution des effectifs (12 mois)</div>
                <div class="chart-wrap">
                    <canvas id="chartEffectifs"/>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-pie"></i> R&#233;partition par statut</div>
                <div class="chart-wrap">
                    <canvas id="chartStatuts"/>
                </div>
            </div>
        </div>
        <div class="two-col">
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-bar"></i> Masse salariale par institution</div>
                <div class="chart-wrap">
                    <canvas id="chartMasseSal"/>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-area"></i> Turnover mensuel</div>
                <div class="chart-wrap">
                    <canvas id="chartTurnover"/>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════ TAB : Effectifs ══════ -->
    <div id="tab-effectifs" class="tab-content">
        <div class="three-col">
            <div class="card">
                <div class="card-title"><i class="fas fa-venus-mars"></i> R&#233;partition par genre</div>
                <div class="chart-wrap">
                    <canvas id="chartGenre"/>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-briefcase"></i> Par cat&#233;gorie</div>
                <div class="chart-wrap">
                    <canvas id="chartCategorie"/>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-hourglass-half"></i> Anc. moyenne</div>
                <div style="text-align:center;padding:30px 0;">
                    <div style="font-size:52px;font-weight:800;color:var(--purple);">0</div>
                    <div style="font-size:13px;color:var(--text2);margin-top:6px;">ann&#233;es en moyenne</div>
                </div>
                <div class="chart-wrap" style="height:160px;">
                    <canvas id="chartAnciennete"/>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-table"></i> Effectifs par structure</div>
            <table class="comp-table">
                <thead>
                    <tr>
                        <th>Structure</th>
                        <th>Institution</th>
                        <th>Effectif</th>
                        <th>Hommes</th>
                        <th>Femmes</th>
                        <th>Vacances</th>
                        <th>R&#233;partition</th>
                    </tr>
                </thead>
                <tbody>
                    <p:dataTable id="dtEffStruc" value="#{adminBean.toutesInstitutions}" var="s" rendered="false"/>
                    <!-- Donn&#233;es de d&#233;monstration -->
                    <tr>
                        <td><strong>Direction RH</strong></td>
                        <td>Min. Finances</td>
                        <td><strong>24</strong></td>
                        <td>14</td>
                        <td>10</td>
                        <td style="color:var(--red);">2</td>
                        <td>
                            <div class="bar-wrap"><div class="bar-fill bar-purple" style="width:80%;"/></div>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Direction Comptabilit&#233;</strong></td>
                        <td>Min. Finances</td>
                        <td><strong>18</strong></td>
                        <td>10</td>
                        <td>8</td>
                        <td style="color:var(--red);">1</td>
                        <td>
                            <div class="bar-wrap"><div class="bar-fill bar-green" style="width:60%;"/></div>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Direction Technique</strong></td>
                        <td>Min. Sant&#233;</td>
                        <td><strong>31</strong></td>
                        <td>22</td>
                        <td>9</td>
                        <td style="color:var(--red);">4</td>
                        <td>
                            <div class="bar-wrap"><div class="bar-fill bar-blue" style="width:100%;"/></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ══════ TAB : Masse salariale ══════ -->
    <div id="tab-masse-salariale" class="tab-content">
        <div class="two-col">
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-bar"></i> Masse salariale mensuelle</div>
                <div class="chart-wrap">
                    <canvas id="chartMasseMensuelle"/>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-pie"></i> R&#233;partition des rubriques</div>
                <div class="chart-wrap">
                    <canvas id="chartRubriques"/>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-table"></i> D&#233;tail par institution</div>
            <table class="comp-table">
                <thead>
                    <tr>
                        <th>Institution</th>
                        <th>Effectif pay&#233;</th>
                        <th>Masse brute</th>
                        <th>Charges patronales</th>
                        <th>Net total</th>
                        <th>Var. M-1</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Min. Finances</strong></td>
                        <td>42</td>
                        <td>18 450 000 FCFA</td>
                        <td>2 767 500 FCFA</td>
                        <td><strong>15 682 500 FCFA</strong></td>
                        <td><span class="kpi-badge up">&#9650; +1.2%</span></td>
                    </tr>
                    <tr>
                        <td><strong>Min. Sant&#233;</strong></td>
                        <td>31</td>
                        <td>12 800 000 FCFA</td>
                        <td>1 920 000 FCFA</td>
                        <td><strong>10 880 000 FCFA</strong></td>
                        <td><span class="kpi-badge down">&#9660; -0.4%</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ══════ TAB : Absentéisme ══════ -->
    <div id="tab-absenteisme" class="tab-content">
        <div class="two-col">
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-line"></i> Taux d'absent&#233;isme (12 mois)</div>
                <div class="chart-wrap">
                    <canvas id="chartAbsMonth"/>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-pie"></i> Motifs d'absence</div>
                <div class="chart-wrap">
                    <canvas id="chartMotifs"/>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════ TAB : Comparatif institutions ══════ -->
    <div id="tab-comparatif" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fas fa-balance-scale"></i> Tableau comparatif multi-institutions</div>
            <div class="toolbar">
                <select class="filter-select">
                    <option>Tous les KPI</option>
                    <option>Effectifs</option>
                    <option>Masse salariale</option>
                    <option>Absent&#233;isme</option>
                </select>
                <select class="filter-select">
                    <option>2025</option>
                    <option>2024</option>
                </select>
            </div>
            <table class="comp-table">
                <thead>
                    <tr>
                        <th>Institution</th>
                        <th>Effectif</th>
                        <th>Masse salariale</th>
                        <th>Taux absent&#233;isme</th>
                        <th>Turnover</th>
                        <th>Poste vacant</th>
                        <th>Tendance</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Min. Finances</strong></td>
                        <td>42 <span class="kpi-badge up">&#9650; +2</span></td>
                        <td>18.4M FCFA</td>
                        <td>3.2%</td>
                        <td>4.1%</td>
                        <td style="color:var(--red);">3</td>
                        <td><span class="kpi-badge up">Positif</span></td>
                    </tr>
                    <tr>
                        <td><strong>Min. Sant&#233;</strong></td>
                        <td>31 <span class="kpi-badge down">&#9660; -1</span></td>
                        <td>12.8M FCFA</td>
                        <td>5.7%</td>
                        <td>6.3%</td>
                        <td style="color:var(--red);">5</td>
                        <td><span class="kpi-badge down">&#192; surveiller</span></td>
                    </tr>
                    <tr>
                        <td><strong>Min. &#201;ducation</strong></td>
                        <td>56 <span class="kpi-badge up">&#9650; +4</span></td>
                        <td>24.1M FCFA</td>
                        <td>2.9%</td>
                        <td>2.8%</td>
                        <td style="color:var(--red);">2</td>
                        <td><span class="kpi-badge up">Positif</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-chart-bar"></i> Comparaison visuelle</div>
            <div class="chart-wrap">
                <canvas id="chartCompInst"/>
            </div>
        </div>
    </div>

    <!-- ══════ TAB : Rapports & Exports ══════ -->
    <div id="tab-rapports" class="tab-content">
        <div class="rapport-grid">

            <div class="rapport-card">
                <div class="rapport-card-icon" style="background:#ede9fe;color:#7c3aed;"><i class="fas fa-users"></i></div>
                <div class="rapport-card-title">Rapport effectifs</div>
                <div class="rapport-card-desc">Liste compl&#232;te des employ&#233;s avec statut, poste, structure et contrat.</div>
                <div class="rapport-card-actions">
                    <h:form>
                        <p:commandButton value="Excel" icon="fas fa-file-excel" styleClass="btn-xs btn-xs-green"
                                         action="#{adminReportingBean.exporterEffectifsCSV}" ajax="false"/>

<script>
//<![CDATA[
/* ── Tab switch ── */
function switchTabR(name, el) {
    document.querySelectorAll('.tab-content').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    var tc = document.getElementById('tab-' + name);
    if (tc) tc.classList.add('active');
    if (el) el.classList.add('active');
    renderChart(name);
}

/* ── Charts ── */
var chartsRendered = {};

function renderChart(tab) {
    if (chartsRendered[tab]) return;
    chartsRendered[tab] = true;

    var months = ['Jan','Fév','Mar','Avr','Mai','Jui','Jul','Aoû','Sep','Oct','Nov','Déc'];
    var colors = { purple:'#7c3aed', green:'#10b981', blue:'#3b82f6', gold:'#b58a3a', red:'#ef4444' };

    if (tab === 'vue-globale') {
        /* Effectifs */
        var c1 = document.getElementById('chartEffectifs');
        if (c1) new Chart(c1, { type:'line', data:{ labels:months, datasets:[{
            label:'Effectif total', data:[120,122,121,125,129,131,130,133,136,138,135,140],
            borderColor:colors.purple, backgroundColor:'rgba(124,58,237,.08)', fill:true, tension:.4, pointRadius:3
        }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }}}});

        /* Statuts */
        var c2 = document.getElementById('chartStatuts');
        if (c2) new Chart(c2, { type:'doughnut', data:{
            labels:['Titulaires','Contractuels','Stagiaires','Détachés'],
            datasets:[{ data:[65,20,10,5], backgroundColor:[colors.purple, colors.green, colors.blue, colors.gold], borderWidth:0 }]
        }, options:{ responsive:true, maintainAspectRatio:false }});

        /* Masse salariale */
        var c3 = document.getElementById('chartMasseSal');
        if (c3) new Chart(c3, { type:'bar', data:{
            labels:['Min. Finances','Min. Santé','Min. Éducation','Min. Justice'],
            datasets:[{ label:'Masse (M FCFA)', data:[18.4,12.8,24.1,9.6], backgroundColor:[colors.purple, colors.green, colors.blue, colors.gold] }]
        }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }}}});

        /* Turnover */
        var c4 = document.getElementById('chartTurnover');
        if (c4) new Chart(c4, { type:'line', data:{ labels:months, datasets:[{
            label:'Entrées', data:[3,1,2,4,2,1,3,2,1,4,2,3], borderColor:colors.green, tension:.4, pointRadius:3
        },{
            label:'Sorties', data:[1,2,1,2,3,1,2,1,2,1,3,2], borderColor:colors.red, tension:.4, pointRadius:3
        }]}, options:{ responsive:true, maintainAspectRatio:false }});
    }

    if (tab === 'effectifs') {
        var cg = document.getElementById('chartGenre');
        if (cg) new Chart(cg, { type:'doughnut', data:{
            labels:['Hommes','Femmes'],
            datasets:[{ data:[62,38], backgroundColor:[colors.blue, '#f472b6'], borderWidth:0 }]
        }, options:{ responsive:true, maintainAspectRatio:false }});

        var cc = document.getElementById('chartCategorie');
        if (cc) new Chart(cc, { type:'bar', data:{
            labels:['Cat A','Cat B','Cat C','Cat D'],
            datasets:[{ data:[30,45,18,7], backgroundColor:[colors.purple, colors.green, colors.blue, colors.gold] }]
        }, options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{ legend:{ display:false }}}});
    }

    if (tab === 'masse-salariale') {
        var cm = document.getElementById('chartMasseMensuelle');
        if (cm) new Chart(cm, { type:'bar', data:{ labels:months, datasets:[{
            label:'Masse salariale (M FCFA)', data:[55,56,56,57,58,58,57,59,60,61,60,62],
            backgroundColor:colors.purple
        }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }}}});

        var cr = document.getElementById('chartRubriques');
        if (cr) new Chart(cr, { type:'pie', data:{
            labels:['Salaire de base','Indemnités','Primes','Heures supp.','Charges'],
            datasets:[{ data:[55,18,14,8,5], backgroundColor:[colors.purple, colors.green, colors.blue, colors.gold, colors.red], borderWidth:0 }]
        }, options:{ responsive:true, maintainAspectRatio:false }});
    }

    if (tab === 'absenteisme') {
        var ca = document.getElementById('chartAbsMonth');
        if (ca) new Chart(ca, { type:'line', data:{ labels:months, datasets:[{
            label:'Taux (%)', data:[3.1,2.8,3.5,4.1,3.2,2.9,3.8,3.0,2.7,4.2,3.5,3.1],
            borderColor:colors.red, backgroundColor:'rgba(239,68,68,.08)', fill:true, tension:.4
        }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }}}});

        var cmo = document.getElementById('chartMotifs');
        if (cmo) new Chart(cmo, { type:'doughnut', data:{
            labels:['Maladie','Congés','Absence injustifiée','Formation','Autre'],
            datasets:[{ data:[40,30,15,10,5], backgroundColor:[colors.red, colors.blue, '#f59e0b', colors.green, colors.purple], borderWidth:0 }]
        }, options:{ responsive:true, maintainAspectRatio:false }});
    }

    if (tab === 'comparatif') {
        var ci = document.getElementById('chartCompInst');
        if (ci) new Chart(ci, { type:'bar', data:{
            labels:['Min. Finances','Min. Santé','Min. Éducation','Min. Justice'],
            datasets:[
                { label:'Effectif', data:[42,31,56,22], backgroundColor:colors.purple },
                { label:'Absent. (%)', data:[3.2,5.7,2.9,4.1], backgroundColor:colors.red, yAxisID:'y2' }
            ]
        }, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true }, y2:{ beginAtZero:true, position:'right', grid:{ drawOnChartArea:false }}}}});
    }
}

/* Rendre le premier tab au chargement */
window.addEventListener('load', function() { renderChart('vue-globale'); });
//]]>
</script>
