<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/rhTemplate.xhtml">

    <ui:param name="page" value="conges"/>
    <ui:define name="title">Calendrier des congés — Espace RH</ui:define>
    <ui:define name="pageTitle">Calendrier des congés</ui:define>
    <ui:define name="breadcrumb">
        <a href="conges.xhtml" style="color:#64748b;text-decoration:none;">Espace RH › Congés</a>
        › Vue calendrier
    </ui:define>

    <ui:define name="styles">
        <style>
            .cal-wrap { background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;min-height:600px; }
            .legende { display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;font-size:12px;color:#64748b; }
            .legende-item { display:inline-flex;align-items:center;gap:6px; }
            .legende-dot { width:10px;height:10px;border-radius:3px; }
        </style>
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet"/>
    </ui:define>

    <ui:define name="content">
        <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
            <a href="conges.xhtml" style="display:inline-flex;align-items:center;gap:6px;
                padding:8px 14px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;
                border-radius:7px;font-size:12px;text-decoration:none;">
                <i class="pi pi-list"/> Vue liste
            </a>
        </div>

        <div class="cal-wrap">
            <div class="legende">
                <span class="legende-item"><span class="legende-dot" style="background:#15803d;"/> Approuvé</span>
                <span class="legende-item"><span class="legende-dot" style="background:#f59e0b;"/> En attente RH</span>
                <span class="legende-item"><span class="legende-dot" style="background:#2563eb;"/> En attente manager</span>
                <span class="legende-item"><span class="legende-dot" style="background:#dc2626;"/> Refusé</span>
            </div>
            <div id="cal"></div>
        </div>
    </ui:define>

    <ui:define name="scripts">
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

        <script id="congeData" type="application/json">
[
<ui:repeat value="#{rhBean.demandesConge}" var="d" varStatus="vs">
{
    "id": "#{d.id}",
    "employe": "#{d.employe.nomComplet}",
    "type": "#{d.typeConge.libelle}",
    "start": "#{d.dateDebut}",
    "end":   "#{d.dateFin}",
    "statut":"#{d.statut}",
    "jours": #{d.nombreJours},
    "motif": "#{d.motif}"
}#{vs.last ? '' : ','}
</ui:repeat>
]
        </script>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var raw = document.getElementById('congeData').textContent;
                var data = [];
                try { data = JSON.parse(raw); } catch (e) { console.error('parse', e); }

                var couleurs = {
                    'APPROUVE':       '#15803d',
                    'EN_ATTENTE_RH':  '#f59e0b',
                    'EN_ATTENTE':     '#2563eb',
                    'REFUSE':         '#dc2626'
                };

                var events = data.map(function(c) {
                    var color = couleurs[c.statut] || '#64748b';
                    // FullCalendar : end est exclusif → on ajoute 1 jour
                    var endDate = new Date(c.end);
                    endDate.setDate(endDate.getDate() + 1);
                    return {
                        id: c.id,
                        title: c.employe + ' — ' + c.type + ' (' + c.jours + 'j)',
                        start: c.start,
                        end:   endDate.toISOString().substring(0, 10),
                        backgroundColor: color,
                        borderColor: color,
                        extendedProps: c
                    };
                });

                var el = document.getElementById('cal');
                if (!el || !window.FullCalendar) return;
                var calendar = new FullCalendar.Calendar(el, {
                    initialView: 'dayGridMonth',
                    locale: 'fr',
                    buttonText: { today:"Aujourd'hui", month:'Mois', week:'Semaine', list:'Liste' },
                    headerToolbar: {
                        left:'prev,next today', center:'title',
                        right:'dayGridMonth,timeGridWeek,listMonth'
                    },
                    height: 700,
                    events: events,
                    eventClick: function(info) {
                        var p = info.event.extendedProps;
                        alert(p.employe + '\n\n' +
                              'Type : ' + p.type + '\n' +
                              'Du ' + p.start + ' au ' + p.end + '\n' +
                              'Durée : ' + p.jours + ' jours\n' +
                              'Statut : ' + p.statut + '\n' +
                              (p.motif ? '\nMotif : ' + p.motif : ''));
                    }
                });
                calendar.render();
            });
        </script>
    </ui:define>

</ui:composition>
